---
title: 《银龄智办》演示短片
---
<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>银龄智办 · 演示短片</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #000;
    overflow: hidden;
  }
  #view {
    display: block;
    width: 1920px;
    height: 1080px;
  }
  #boot {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    color: #8fa6b4;
    font: 400 22px/1.6 "Noto Sans CJK SC", sans-serif;
    background: #000;
    z-index: 10;
  }
  #boot.hidden { display: none; }
</style>
</head>
<body>
  <canvas id="view" width="1920" height="1080"></canvas>
  <div id="boot">正在装载字体与场景…</div>

  <script type="importmap">
  {
    "imports": {
      "three": "/node_modules/three/build/three.module.js",
      "three/addons/": "/node_modules/three/examples/jsm/",
      "three/examples/jsm/": "/node_modules/three/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import { boot } from './src/main.js'
    boot().catch((err) => {
      window.__error = String(err && err.stack || err)
      document.getElementById('boot').textContent = '装载失败：' + err
      console.error(err)
    })
  </script>
</body>
</html>
