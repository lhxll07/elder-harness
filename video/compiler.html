<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>银龄智办 · 为人编译</title>
  <style>
    html, body { margin: 0; overflow: hidden; background: #121315; }
    #view { display: block; width: 1920px; height: 1080px; }
    #boot { position: fixed; inset: 0; display: grid; place-items: center; color: #dbd3c4; background: #121315; font: 24px sans-serif; }
    #boot.hidden { display: none; }
  </style>
</head>
<body>
  <canvas id="view" width="1920" height="1080"></canvas>
  <div id="boot">正在装载编译长镜头…</div>
  <script type="importmap">
    { "imports": { "three": "/node_modules/three/build/three.module.js", "three/examples/jsm/": "/node_modules/three/examples/jsm/" } }
  </script>
  <script type="module">
    import { boot } from './src/compiler-film.js'
    boot().catch(error => {
      window.__error = String(error.stack || error)
      document.getElementById('boot').textContent = window.__error
      console.error(error)
    })
  </script>
</body>
</html>
