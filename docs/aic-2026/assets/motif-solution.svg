<!-- 方案：闸门 —— 动作自左向右流动，金色竖闸门只读动作内容；
     越过者继续，被拦者折返 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700">
  <line x1="0" y1="350" x2="1200" y2="350" stroke="#4fd1c5" stroke-width="2" opacity=".18"/>
  <g fill="#4fd1c5" opacity=".30">
    <circle cx="150" cy="350" r="9"/><circle cx="260" cy="350" r="9"/>
    <circle cx="370" cy="350" r="9"/><circle cx="480" cy="350" r="9"/>
  </g>
  <rect x="800" y="90" width="8" height="520" rx="4" fill="#c9a227" opacity=".38"/>
  <g fill="#4fd1c5" opacity=".22">
    <circle cx="900" cy="350" r="9"/><circle cx="1010" cy="350" r="9"/><circle cx="1120" cy="350" r="9"/>
  </g>
  <path d="M700 350 L760 350 L760 500 L700 500" fill="none" stroke="#c9a227"
        stroke-width="2.5" stroke-dasharray="7 8" opacity=".40"/>
  <circle cx="700" cy="500" r="9" fill="#c9a227" opacity=".30"/>
</svg>
