  <h1 class="title">一个可复用的判据，一条独立的判定依据</h1>
  <div class="subtitle">创新不在训练新的基础模型，而在<strong>把「可信」从事后补丁提升为架构的第一性约束</strong>。</div>
  <div class="head-rule"></div>

  <div class="body">
    <div class="cols c2" style="gap:48px">
      <div class="panel good" style="background:var(--accent-tint);padding:32px 34px">
        <div class="ph" style="color:var(--accent-deep)">判据 · 动作后果是否可逆</div>
        <div style="font-size:37px;font-weight:700;letter-spacing:-0.02em;line-height:1.25;color:var(--ink)" class="mt16">
          可逆 → 直接执行<br>
          不可逆 → 交还本人
        </div>
        <div class="cb mt24" style="font-size:16.5px;color:var(--ink-2)">
          一次判据、<strong>三层复用</strong>：屏幕动作 → 业务动作 → 导航动作。<br>
          说明它是<strong>组织原则</strong>，不是三处分散的补丁。
        </div>
      </div>
      <div class="panel good" style="padding:32px 34px">
        <div class="ph">依据 · 本轮自己的执行记录</div>
        <div style="font-size:37px;font-weight:700;letter-spacing:-0.02em;line-height:1.25;color:var(--ink)" class="mt16">
          不采信模型自述<br>
          只扫描本轮调用日志
        </div>
        <div class="cb mt24" style="font-size:16.5px;color:var(--ink-2)">
          给出<strong>三值</strong>结论：通过 / 无法确认 / 驳回。<br>
          其中「无法确认」是对老人的<strong>诚实输出</strong>，而不是失败。
        </div>
      </div>
    </div>
