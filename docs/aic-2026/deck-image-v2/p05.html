<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>银龄智办 · 3PA 总体架构</title>
    <link rel="stylesheet" href="p05.css">
  </head>
  <body>
    <main class="viewport" aria-label="银龄智办答辩第五页：三平面可信执行总体架构">
      <article class="slide" aria-labelledby="slide-title">
        <img class="background" src="assets/p05-background-unified-v01.png" alt="瓷白浅蓝架构图：三张透明机制平面共同支撑横向五节点执行主干，底部四个部署模块与其相连">

        <header class="heading">
          <p class="chapter">总体架构</p>
          <h1 id="slide-title"><span>3PA</span>，让每一步执行可信</h1>
        </header>

        <p class="brand">银龄智办</p>

        <section class="trust-planes" aria-label="绑定面、授权面与证据面共同支撑同一执行过程">
          <div class="plane-copy plane-binding">
            <div class="plane-heading">
              <h2><span>P1</span>绑定面</h2>
              <p class="plane-mechanism">页面版本绑定</p>
            </div>
          </div>
          <div class="plane-copy plane-authorization">
            <div class="plane-heading">
              <h2><span>P2</span>授权面</h2>
              <p class="plane-mechanism">类型化分级执行</p>
            </div>
          </div>
          <div class="plane-copy plane-evidence">
            <div class="plane-heading">
              <h2><span>P3</span>证据面</h2>
              <p class="plane-mechanism">来源分型核验</p>
            </div>
          </div>
        </section>

        <p class="section-label execution-label">执行主干</p>
        <section class="execution" aria-label="观察、规划、派发、执行、收尾五个执行环节">
          <div class="execution-node node-observe">
            <h2>观察</h2>
          </div>
          <div class="execution-node node-plan">
            <h2>规划</h2>
          </div>
          <div class="execution-node node-dispatch">
            <h2>派发</h2>
          </div>
          <div class="execution-node node-execute">
            <h2>执行</h2>
          </div>
          <div class="execution-node node-finish">
            <h2>收尾</h2>
          </div>
        </section>

        <p class="section-label deployment-label">部署视图</p>
        <section class="deployment soft-panel" aria-label="交互层、核心层、Android平台层与协作服务层">
          <div class="deployment-part deployment-interaction">
            <h2>交互层</h2>
          </div>
          <div class="deployment-part deployment-core">
            <h2>核心层</h2>
          </div>
          <div class="deployment-part deployment-android">
            <h2><span>Android</span> 平台层</h2>
          </div>
          <div class="deployment-part deployment-service">
            <h2>协作服务层</h2>
          </div>
        </section>

        <footer class="footer">
          <p class="page-number" aria-label="第5页，共17页"><strong>05</strong><span>/</span>17</p>
        </footer>
      </article>
    </main>
    <script>
      const slide = document.querySelector(".slide");
      function fitSlide() {
        const scale = Math.min(window.innerWidth / 2048, window.innerHeight / 1152);
        slide.style.setProperty("--slide-scale", scale.toString());
      }
      fitSlide();
      window.addEventListener("resize", fitSlide);
      document.addEventListener("keydown", (event) => {
        if (event.ctrlKey || event.metaKey || event.altKey) return;
        if (event.key.toLowerCase() === "f") {
          if (document.fullscreenElement) {
            document.exitFullscreen();
          } else {
            document.documentElement.requestFullscreen();
          }
        }
        if (event.key === "ArrowLeft") {
          window.location.href = "p04.html";
        }
        if (event.key === "ArrowRight") {
          window.location.href = "p06.html";
        }
      });
      document.fonts.ready.then(() => {
        document.documentElement.dataset.ready = "true";
      });
    </script>
  </body>
</html>
