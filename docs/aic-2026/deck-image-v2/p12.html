<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>银龄智办 · 机制实证</title>
    <link rel="stylesheet" href="continuation.css">
    <script src="continuation.js" defer></script>
  </head>
  <body>
    <main class="viewport" aria-label="银龄智办答辩第十二页：归档样本的机制分层对照">
      <article class="slide p12" data-page="12" data-previous="p11.html" data-next="p13.html" aria-labelledby="slide-title">
        <img class="background" src="assets/p12-background.png" alt="瓷白浅蓝双绘图区，上方两组蓝金机制图标，下方保留开放数据展示空间">
        <header class="heading">
          <p class="chapter">机制实证</p>
          <h1 id="slide-title">机制增益，<span>清楚可见</span></h1>
        </header>
        <p class="brand">银龄智办</p>
        <section class="chart-group risk-chart" data-chart="risk" data-total="20" aria-labelledby="risk-title">
          <h2 id="risk-title">风险动作拦截</h2>
          <p class="chart-unit">拦截数 / 归档样本数</p>
          <div class="chart-plot">
            <div class="chart-grid grid-high" aria-hidden="true"></div>
            <div class="chart-grid grid-middle" aria-hidden="true"></div>
            <div class="chart-grid grid-zero" aria-hidden="true"></div>
            <p class="axis-tick tick-high" aria-hidden="true">20</p>
            <p class="axis-tick tick-middle" aria-hidden="true">10</p>
            <p class="axis-tick tick-zero" aria-hidden="true">0</p>
            <div class="chart-columns">
              <div class="chart-column" data-count="6" style="--count: 6; --total: 20">
                <div class="chart-bar" aria-hidden="true"></div>
                <p class="chart-value">6 <span>/ 20</span></p>
                <p class="chart-label">固定词表</p>
              </div>
              <div class="chart-column improved" data-count="15" style="--count: 15; --total: 20">
                <div class="chart-bar" aria-hidden="true"></div>
                <p class="chart-value">15 <span>/ 20</span></p>
                <p class="chart-label">分级执行</p>
              </div>
            </div>
          </div>
        </section>
        <section class="chart-group evidence-chart" data-chart="evidence" data-total="22" aria-labelledby="evidence-title">
          <h2 id="evidence-title">伪造完成声明拦截</h2>
          <p class="chart-unit">拦截数 / 归档样本数</p>
          <div class="chart-plot">
            <div class="chart-grid grid-high" aria-hidden="true"></div>
            <div class="chart-grid grid-middle" aria-hidden="true"></div>
            <div class="chart-grid grid-zero" aria-hidden="true"></div>
            <p class="axis-tick tick-high" aria-hidden="true">22</p>
            <p class="axis-tick tick-middle" aria-hidden="true">11</p>
            <p class="axis-tick tick-zero" aria-hidden="true">0</p>
            <div class="chart-columns">
              <div class="chart-column" data-count="0" style="--count: 0; --total: 22">
                <div class="chart-bar" aria-hidden="true"></div>
                <p class="chart-value">0 <span>/ 22</span></p>
                <p class="chart-label">无核验</p>
              </div>
              <div class="chart-column improved" data-count="12" style="--count: 12; --total: 22">
                <div class="chart-bar" aria-hidden="true"></div>
                <p class="chart-value">12 <span>/ 22</span></p>
                <p class="chart-label">机械核验</p>
              </div>
              <div class="chart-column complete" data-count="22" style="--count: 22; --total: 22">
                <div class="chart-bar" aria-hidden="true"></div>
                <p class="chart-value">22 <span>/ 22</span></p>
                <p class="chart-label long-label">机械核验<br>＋文本证据</p>
              </div>
            </div>
          </div>
        </section>
        <p class="chart-conclusion">风险识别更准<span>·</span>完成核对更实</p>
        <footer>
          <p class="source"><a href="../deck-image-v1/sources.md">归档对照样本：风险动作 20 项；伪造完成声明 22 项</a></p>
          <p class="page-number" aria-label="第12页，共17页"><strong>12</strong><span>/</span>17</p>
        </footer>
      </article>
    </main>
  </body>
</html>
