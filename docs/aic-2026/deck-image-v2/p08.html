<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>银龄智办 · 证据创新</title>
    <link rel="stylesheet" href="p08.css">
  </head>
  <body>
    <main class="viewport" aria-label="银龄智办答辩第八页：来源分型账本与三层完成核验">
      <article class="slide" aria-labelledby="slide-title">
        <img class="background" src="assets/p08-background.png" alt="瓷白蓝金流程：物流页面与时钟工具凭据汇入事实账本，依次经过动作、文本和语义核验，连接到金边结果单">

        <header class="heading">
          <p class="chapter">证据创新</p>
          <h1 id="slide-title">每一个办结，都有<span>事实依据</span></h1>
        </header>

        <p class="brand">银龄智办</p>

        <section class="fact-sources" aria-label="本轮页面事实与工具事实；物流状态沿用第四页归档案例">
          <h2 class="group-title source-title">事实采集</h2>
          <p class="source-page-title" data-zone="source-header">物流页面</p>
          <p class="package-status package-first" data-zone="package-first">待取件</p>
          <p class="package-status package-second" data-zone="package-second">已签收</p>
          <p class="package-status package-third" data-zone="package-third">已签收</p>
          <p class="package-status package-fourth" data-zone="package-fourth">已签收</p>
          <div class="tool-copy" data-zone="tool-receipt">
            <h3>本地工具</h3>
            <p class="tool-fact">当前时间</p>
          </div>
        </section>

        <section class="provenance" aria-label="本轮事实账本：应用、页面版本、执行步骤、事实来源">
          <h2 class="group-title ledger-title">来源绑定</h2>
          <p class="ledger-heading" data-zone="ledger-header">事实账本</p>
          <div class="ledger-field field-app" data-zone="ledger-app"><h3>应用</h3></div>
          <div class="ledger-field field-revision" data-zone="ledger-revision"><h3>页面版本</h3></div>
          <div class="ledger-field field-step" data-zone="ledger-step"><h3>执行步骤</h3></div>
          <div class="ledger-field field-origin" data-zone="ledger-origin"><h3>事实来源</h3></div>
        </section>

        <section class="review-chain" aria-label="先动作一致性，再文本证据，随后模型语义复核">
          <h2 class="group-title review-title">三层核验</h2>
          <div class="review-stage review-action"><h3><span>01</span>动作一致性</h3></div>
          <div class="review-stage review-evidence"><h3><span>02</span>文本证据</h3></div>
          <div class="review-stage review-semantic"><h3><span>03</span>语义复核</h3></div>
        </section>

        <section class="result" aria-label="物流查询结果示意：1单待取件，另有3单已签收">
          <h2 class="group-title result-title">结果交付</h2>
          <p class="result-service" data-zone="result-header">快递查询</p>
          <div class="result-body" data-zone="result-body">
            <h3>状态已核对</h3>
            <p class="result-primary"><strong>1</strong><span>单待取件</span></p>
            <p class="result-secondary">另有 <strong>3</strong> 单已签收</p>
          </div>
        </section>

        <section class="values soft-panel" aria-label="证据机制的三项价值">
          <div class="value-copy value-source"><h2>来源可追溯</h2></div>
          <div class="value-copy value-order"><h2>过程可核验</h2></div>
          <div class="value-copy value-result"><h2>结果可核对</h2></div>
        </section>

        <footer class="footer">
          <p class="footer-note">机制示意<span>·</span>物流案例同第 4 页</p>
          <p class="page-number" aria-label="第8页，共17页"><strong>08</strong><span>/</span>17</p>
        </footer>
      </article>
    </main>
    <script>
      const slide = document.querySelector(".slide");
      function fitSlide() {
        const scale = Math.min(window.innerWidth / 2048, window.innerHeight / 1152);
        slide.style.setProperty("--slide-scale", scale.toString());
      }
      fitSlide();
      window.addEventListener("resize", fitSlide);
      document.addEventListener("keydown", (event) => {
        if (event.ctrlKey || event.metaKey || event.altKey) return;
        if (event.key.toLowerCase() === "f") {
          if (document.fullscreenElement) {
            document.exitFullscreen();
          } else {
            document.documentElement.requestFullscreen();
          }
        }
        if (event.key === "ArrowLeft") {
          window.location.href = "p07.html";
        }
        if (event.key === "ArrowRight") {
          window.location.href = "p09.html";
        }
      });
      document.fonts.ready.then(() => {
        document.documentElement.dataset.ready = "true";
      });
    </script>
  </body>
</html>
