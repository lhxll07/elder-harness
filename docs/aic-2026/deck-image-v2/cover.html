<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>银龄智办 · 答辩封面</title>
    <link rel="stylesheet" href="cover.css">
  </head>
  <body>
    <main class="viewport" aria-label="银龄智办答辩封面">
      <article class="slide" aria-labelledby="project-title">
        <img class="background" src="assets/cover-background.png" alt="蓝金科技背景，右侧为细长手机、语音入口与跨应用连接图形">

        <header class="event">
          <p class="event-name">2026年第八届全球校园人工智能算法精英大赛</p>
          <p class="event-track">AI+软件创新</p>
        </header>

        <section class="identity">
          <h1 id="project-title">银龄<span>智办</span></h1>
          <p class="subtitle">可信跨应用助老智能体</p>
          <p class="tagline">一句话办事，让数字生活触手可及</p>
        </section>

        <ul class="capabilities" aria-label="四项核心优势">
          <li>跨应用执行</li>
          <li><span class="latin">3PA</span> 可信架构</li>
          <li>经验驱动演进</li>
          <li>亲友轻量协同</li>
        </ul>

        <div class="phone-copy" aria-hidden="true">
          <span class="phone-status">我在</span>
          <span class="phone-caption">说给接线员听</span>
          <span class="phone-hint">点一下开始说话</span>
        </div>

        <footer class="team">
          <p class="team-name">能工智人团队</p>
          <p class="entry"><span>参赛编号</span><span class="entry-number">AIC-2026-86471901</span></p>
        </footer>

        <p class="edition">作品答辩 <span>·</span> 2026 年 10 月</p>
        <p class="page-number" aria-label="第1页，共17页"><strong>01</strong><span>/</span>17</p>
      </article>
    </main>
    <script>
      const slide = document.querySelector(".slide");
      function fitSlide() {
        const scale = Math.min(window.innerWidth / 2048, window.innerHeight / 1152);
        slide.style.setProperty("--slide-scale", scale.toString());
      }
      fitSlide();
      window.addEventListener("resize", fitSlide);
      document.addEventListener("keydown", (event) => {
        if (event.key === "ArrowRight" && !event.ctrlKey && !event.metaKey && !event.altKey) {
          window.location.href = "p02.html";
        }
        if (event.key.toLowerCase() === "f" && !event.ctrlKey && !event.metaKey && !event.altKey) {
          if (document.fullscreenElement) {
            document.exitFullscreen();
          } else {
            document.documentElement.requestFullscreen();
          }
        }
      });
      document.fonts.ready.then(() => {
        document.documentElement.dataset.ready = "true";
      });
    </script>
  </body>
</html>
