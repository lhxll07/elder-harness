<div class="slide">
  <div class="eyebrow"><span class="num">04</span> 问题 · 现有的两种助手</div>
  <h1 class="title">一种不敢用，一种用不下去</h1>
  <div class="subtitle">市面上的手机助手，基本落在两个极端。它们看起来相反，其实卡在同一个地方。</div>

  <div class="body center">
    <div class="cols c2" style="gap:72px">
      <div class="panel tint-red" style="padding:38px 40px;min-height:300px">
        <span class="tag solid-red">全自动</span>
        <div class="pt" style="font-size:28px;margin-top:22px;line-height:1.4">
          一步不问，<br>直接下单、付款、发送
        </div>
        <div class="pd" style="font-size:17.5px;margin-top:18px">
          能力上限已经被 Mobile-Agent、AppAgent、AutoDroid 证明。<br>
          但对老人来说，<strong style="color:var(--ink)">一次错付就是真金白银</strong>。
        </div>
      </div>

      <div class="panel tint-amber" style="padding:38px 40px;min-height:300px">
        <span class="tag solid-amber">逐步确认</span>
        <div class="pt" style="font-size:28px;margin-top:22px;line-height:1.4">
          十步任务，<br>十次弹窗
        </div>
        <div class="pd" style="font-size:17.5px;margin-top:18px">
          确认变成橡皮图章：老人不理解在确认什么，只会一路点「允许」。<br>
          我们实测：<strong style="color:var(--ink)">智能体执行 0 项，用户确认 10 次</strong>。
        </div>
      </div>
    </div>

    <div style="margin-top:52px;display:grid;grid-template-columns:auto 1fr;gap:36px;align-items:center;border-top:1px solid var(--rule);padding-top:32px">
      <div class="numlabel" style="margin:0">所以真正的问题</div>
      <div class="statement sm" style="font-size:46px">
        不是「能不能点」，而是<em>「该在哪一步停下来」</em>。
      </div>
    </div>
  </div>
